<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#CFE4DD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="生活事务台">
<title>生活事务台 · 一站式统筹</title>
<style>
:root{
  --primary:#8D6C63;--primary-soft:#CFE4DD;--primary2:#FCD3D5;
  --success:#5F9C86;--success-soft:#CFE4DD;
  --warn:#D98B86;--warn-soft:#FCD3D5;
  --bg:#F9F4EA;--card:#FFFFFF;
  --text:#8D6C63;--text-soft:#A98B7E;--line:#ECE3D7;--shadow:0 6px 20px rgba(141,108,99,.10);--radius:18px;
.authbox{display:inline-flex;gap:6px;align-items:center;margin-left:6px;}
.auth-user{font-size:12px;color:var(--text-soft);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.loginbtn{background:var(--primary-soft);color:#5b6b63;border:1px solid var(--line);border-radius:20px;padding:3px 12px;font-size:12px;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;overscroll-behavior:none;}
button{font-family:inherit;cursor:pointer;border:none;outline:none;}
input,select,textarea{font-family:inherit;font-size:15px;outline:none;}
.app{display:flex;min-height:100vh;}
.sidebar{width:230px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:4px;flex-shrink:0;position:sticky;top:0;height:100vh;}
.brand{display:flex;align-items:center;gap:10px;padding:8px 10px 14px;}
.brand .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--primary),#E9C6CE);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:var(--shadow);}
.brand .t1{font-weight:700;font-size:16px;}.brand .t2{font-size:11px;color:var(--text-soft);}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--text);font-size:14.5px;transition:.18s;user-select:none;}
.nav-item .ico{font-size:18px;width:22px;text-align:center;}
.nav-item:hover{background:var(--primary-soft);}
.nav-item.active{background:var(--primary-soft);color:var(--text);box-shadow:var(--shadow);}
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{position:sticky;top:0;z-index:30;background:rgba(247,242,240,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 18px;}
.topbar .hamb{display:none;font-size:22px;background:none;color:var(--text);padding:4px 8px;border-radius:10px;}
.topbar .title{font-weight:700;font-size:17px;}
.topbar .meta{margin-left:auto;text-align:right;color:var(--text-soft);font-size:12.5px;line-height:1.35;}
.topbar .meta b{color:var(--text);font-weight:600;}
.topbar .edit-tag{background:none;color:var(--primary);font-size:12px;margin-top:2px;text-decoration:underline;}
.topbar .saveflag{font-size:11.5px;color:var(--success);margin-top:3px;opacity:0;transition:opacity .3s;}
.topbar .saveflag.show{opacity:1;}
.topbar .saveflag.flash{animation:saveflash .6s ease;}
@keyframes saveflash{0%{color:var(--success);}30%{color:var(--primary);transform:scale(1.08);}100%{color:var(--success);transform:scale(1);}}
.content{padding:18px;max-width:1100px;width:100%;margin:0 auto;}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px;border:1px solid var(--line);}
.card h3{margin:0 0 14px;font-size:16px;display:flex;align-items:center;gap:8px;}
.card h3 .badge{font-size:11px;background:var(--primary-soft);color:var(--primary);padding:2px 8px;border-radius:20px;font-weight:600;}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.muted{color:var(--text-soft);font-size:13px;}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;}
.pill.p{background:var(--primary-soft);color:var(--primary);}.pill.s{background:var(--success-soft);color:var(--success);}.pill.w{background:var(--warn-soft);color:var(--warn);}.pill.o{background:#EFE7E3;color:var(--text-soft);}
.btn{background:var(--primary);color:#fff;border-radius:12px;padding:9px 15px;font-size:14px;font-weight:600;box-shadow:var(--shadow);transition:.15s;}
.btn:hover{filter:brightness(1.05);}.btn:active{transform:scale(.97);}
.btn.ghost{background:var(--primary-soft);color:var(--primary);box-shadow:none;}.btn.ghost:hover{background:var(--primary);color:#fff;}
.btn.success{background:var(--success);}.btn.warn{background:var(--warn);}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px;}
.btn.line{background:#fff;color:var(--text);border:1px solid var(--line);box-shadow:none;}.btn.line:hover{border-color:var(--primary);color:var(--primary);}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px;}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);}
th{color:var(--text-soft);font-weight:600;background:var(--bg);}
tr:hover td{background:var(--primary-soft);}
.num{text-align:right;font-variant-numeric:tabular-nums;}
/* 薪资分配表：清爽轻量，去除厚重边框 */
table.alloc{font-size:13px;background:transparent;border:none;margin-top:10px;}
table.alloc th,table.alloc td{border:none;border-bottom:1px solid var(--line);padding:11px 8px;}
table.alloc th{background:transparent;color:var(--text-soft);font-weight:600;font-size:12.5px;}
table.alloc tbody tr:last-child td{border-bottom:none;}
.fld{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;color:var(--text);font-size:13px;outline:none;transition:.15s;}
.fld:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
.empty{text-align:center;color:var(--text-soft);padding:26px 10px;font-size:14px;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;}
.stat{background:var(--bg);border-radius:14px;padding:14px;}.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;}.stat .l{font-size:12px;color:var(--text-soft);margin-top:2px;}
/* 存钱罐：统计块竖排在圆柱右侧 */
.stats-side{display:flex;flex-direction:column;gap:8px;width:auto;max-width:none;margin:0;}
.stats-side .stat{background:rgba(255,255,255,.65);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:118px;}
.stats-side .stat .v{font-size:18px;}
.seg{display:inline-flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px;}
.seg button{background:none;color:var(--text-soft);padding:6px 13px;border-radius:9px;font-size:13px;font-weight:600;}.seg button.on{background:var(--primary);color:#fff;}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.tabs button{background:var(--bg);border-radius:11px;padding:8px 14px;font-size:13.5px;color:var(--text-soft);font-weight:600;}
.tabs button.on{background:var(--primary);color:#fff;}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.field label{font-size:13px;color:var(--text-soft);font-weight:600;}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;color:var(--text);width:100%;}
.field textarea{resize:vertical;min-height:64px;}
.field.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.overlay{position:fixed;inset:0;background:rgba(74,63,61,.45);z-index:90;display:flex;align-items:flex-end;justify-content:center;}
.overlay.center{align-items:center;}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px;max-height:88vh;overflow:auto;animation:up .25s ease;}
.overlay.center .sheet{border-radius:22px;animation:pop .2s ease;}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.94);opacity:.5}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 16px;font-size:18px;display:flex;align-items:center;justify-content:space-between;}
.sheet .close{background:var(--bg);border-radius:10px;width:32px;height:32px;font-size:18px;color:var(--text-soft);}
.sheet .actions{display:flex;gap:10px;margin-top:8px;}.sheet .actions .btn{flex:1;}
.bottomnav{display:none;}.drawer-mask{display:none;}
.reminder{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:120;background:#fff;border:2px solid var(--primary);border-radius:16px;box-shadow:var(--shadow);padding:14px 18px;max-width:340px;width:calc(100% - 32px);animation:pop .25s ease;}
.reminder .rt{font-weight:700;color:var(--primary);display:flex;align-items:center;gap:8px;}.reminder .rb{margin-top:6px;font-size:13.5px;color:var(--text);}.reminder .ra{margin-top:10px;text-align:right;}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:11px 20px;border-radius:30px;font-size:14px;z-index:200;box-shadow:var(--shadow);animation:pop .2s ease;opacity:.96;}
.toast.ok{background:var(--success);}.toast.warn{background:var(--warn);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-cell{aspect-ratio:1/1;border-radius:12px;background:var(--bg);padding:6px;font-size:12px;position:relative;overflow:hidden;}
.cal-cell.head{background:none;color:var(--text-soft);font-weight:700;text-align:center;aspect-ratio:auto;padding:4px;}
.cal-cell.today{outline:2px solid var(--primary);}
.cal-cell .d{font-weight:700;}.cal-cell .ev{font-size:10px;line-height:1.25;color:var(--primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-cell .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;}
.dot.p0{background:var(--warn);}.dot.p1{background:var(--primary);}.dot.p2{background:var(--text-soft);}
.vcard{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border-radius:14px;padding:12px;margin-bottom:10px;}
.vcard .vt{font-size:26px;}.vcard .vmeta{flex:1;min-width:0;}.vcard .vtitle{font-weight:600;font-size:14px;word-break:break-all;}
.vcard .vtag{display:inline-block;font-size:11px;background:var(--primary-soft);color:var(--primary);padding:1px 8px;border-radius:20px;margin-top:4px;}
.vcard a{color:var(--success);font-size:12.5px;word-break:break-all;}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;}
.album .ph{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:1/1;background:var(--bg);}
.album .ph img{width:100%;height:100%;object-fit:cover;}.album .ph .del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.5);color:#fff;border-radius:8px;width:24px;height:24px;font-size:14px;}
canvas{max-width:100%;}
@media(max-width:900px){
  .sidebar{display:none;}.topbar .hamb{display:block;}
  .drawer-mask.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:80;}
  .sidebar.show{display:flex;position:fixed;left:0;top:0;z-index:85;box-shadow:var(--shadow);animation:up .2s ease;}
  .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:70;overflow-x:auto;padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom));}
  .bottomnav .bn{flex:1 0 auto;min-width:62px;text-align:center;padding:6px 4px;border-radius:12px;color:var(--text-soft);font-size:11px;}
  .bottomnav .bn .bi{font-size:20px;display:block;margin-bottom:2px;}
  .bottomnav .bn.on{color:var(--primary);background:var(--primary-soft);}
  .content{padding:14px 14px 86px;}
}
@media(min-width:901px){.bottomnav{display:none!important;}}
/* ===== 记账助手聊天 ===== */
.chat{display:flex;flex-direction:column;}
.chatlog{flex:1;max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:6px 2px 10px;margin-bottom:8px;background:var(--bg);border-radius:14px;}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:100%;}
.msg .av{font-size:20px;flex:0 0 auto;width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:50%;box-shadow:var(--shadow);}
.msg .bubble{background:#fff;border-radius:14px;padding:10px 13px;font-size:13.5px;line-height:1.55;box-shadow:var(--shadow);max-width:88%;word-break:break-word;}
.msg.user{flex-direction:row-reverse;}
.msg.user .bubble{background:var(--primary);color:#fff;}
.msg.user .bubble table th,.msg.user .bubble table td{color:#fff;border-color:rgba(255,255,255,.3);}
.msg.user .bubble table th{background:rgba(255,255,255,.12);}
.chatlog .bubble h4{margin:8px 0 4px;font-size:14px;}
.chatbar{display:flex;gap:8px;}
.chatbar input{flex:1;}
.chiprow{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0;}
.chip{background:var(--primary-soft);color:var(--primary);border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:600;white-space:nowrap;}
.chip:active{transform:scale(.96);}
.okbox{background:var(--success-soft);color:#2f5b50;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.6;}
.warnbox{background:var(--warn-soft);color:#7a3f35;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.6;}
/* ===== 子菜单 / 子标签 ===== */
.nav-item.sub{padding-left:30px;font-size:13.5px;gap:9px;}
.nav-item.sub .ico{font-size:13px;opacity:.55;width:14px;text-align:center;}
.nav-item.sub.active{background:var(--primary2);}
.subnav{display:flex;gap:8px;margin-bottom:14px;background:var(--card);padding:6px;border-radius:14px;box-shadow:var(--shadow);flex-wrap:wrap;}
.subnav-btn{flex:1 1 auto;min-width:120px;background:var(--bg);border-radius:10px;padding:9px 12px;font-size:14px;font-weight:600;color:var(--text-soft);}
.subnav-btn.on{background:var(--primary-soft);color:var(--text);}
/* ===== 课时月历 ===== */
table.cal{width:100%;border-collapse:separate;border-spacing:3px;}
table.cal th{background:var(--primary-soft);color:var(--text);font-size:13px;padding:8px 4px;text-align:center;border-radius:10px;}
table.cal td.cal-cell{vertical-align:top;height:56px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 4px;cursor:pointer;transition:box-shadow .15s,transform .1s;}
table.cal td.cal-cell:hover{box-shadow:var(--shadow);transform:translateY(-1px);}
table.cal td.cal-empty{background:var(--bg);border:none;cursor:default;}
table.cal td.cal-empty:hover{box-shadow:none;transform:none;}
.cal-day{font-weight:700;font-size:12px;color:var(--text-soft);margin-bottom:2px;}
.cal-cell.cal-today{background:var(--primary-soft);}
.cal-cell.cal-today .cal-day{color:var(--primary);}
.cal-h{font-size:11.5px;line-height:1.35;color:var(--text);}
.cal-fee{font-size:10.5px;line-height:1.3;color:var(--success);margin-top:2px;}
.cal-none{color:#cdc3bf;font-size:15px;text-align:center;margin-top:6px;}
.cal-mark{color:var(--warn);font-weight:600;}
.cal-flower{font-size:12px;}
tr.cal-sub td{background:var(--bg);font-size:12.5px;color:var(--text-soft);padding:10px 8px;text-align:center;font-weight:600;border-radius:10px;}
tr.cal-tot td{background:var(--primary-soft);font-size:14px;color:var(--text);padding:11px 8px;text-align:center;font-weight:700;border-radius:10px;}
@media(max-width:560px){table.cal th{font-size:11px;padding:6px 2px;}table.cal td.cal-cell{height:48px;padding:3px 2px;}table.cal td.cal-cell{font-size:10.5px;}.cal-day{font-size:10.5px;}.cal-h{font-size:10px;}.cal-fee{font-size:9.5px;}.cal-none{font-size:13px;}}
/* ===== 整周课表网格 ===== */
.sch-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:4px;}
table.schtab{width:100%;border-collapse:separate;border-spacing:5px;min-width:560px;}
table.schtab th{background:var(--primary-soft);color:var(--text);font-size:13px;padding:9px 6px;text-align:center;border-radius:10px;font-weight:600;}
table.schtab th.sch-sec-h{background:var(--bg);color:var(--text-soft);}
table.schtab th.sch-today-h{background:var(--primary);color:#fff;}
table.schtab td.sch-sec{background:var(--bg);color:var(--text-soft);font-weight:600;font-size:13px;text-align:center;border-radius:10px;padding:8px 6px;white-space:nowrap;}
table.schtab td.sch-cell{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 6px;vertical-align:top;min-width:74px;transition:box-shadow .15s,transform .1s;}
table.schtab td.sch-cell:hover{box-shadow:var(--shadow);transform:translateY(-1px);}
table.schtab td.sch-cell.sch-today{background:var(--primary-soft);border-color:var(--primary);}
table.schtab td.sch-empty{background:var(--bg);border:none;color:#d8cfcb;font-size:14px;text-align:center;}
table.schtab td.sch-empty:hover{box-shadow:none;transform:none;}
.sch-course{font-size:13px;font-weight:600;line-height:1.35;color:var(--text);}
.sch-place{font-size:11px;line-height:1.3;color:var(--text-soft);margin-top:3px;}
/* ===== 金猪存钱 ===== */
.pigwrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0 2px;}
.piggy{position:relative;width:170px;height:158px;}
.piggy .jar{position:absolute;inset:0;border-radius:34px 34px 46px 46px;background:linear-gradient(180deg,#FCD3D5,#F4BFC4);box-shadow:var(--shadow);overflow:hidden;border:4px solid #fff;}
.piggy .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#BFE0D5,#9FCDBF);transition:height .9s cubic-bezier(.2,.8,.2,1);}
.piggy .face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:60px;z-index:2;filter:drop-shadow(0 2px 3px rgba(141,108,99,.25));}
.piggy .pct{position:absolute;bottom:9px;left:0;right:0;text-align:center;z-index:3;font-weight:700;color:#5b463c;font-size:14px;text-shadow:0 1px 2px rgba(255,255,255,.6);}
.piggy .ear{position:absolute;top:6px;width:30px;height:30px;background:#F4BFC4;border-radius:50% 50% 50% 10%;z-index:1;}
.piggy .ear.l{left:34px;transform:rotate(-18deg);} .piggy .ear.r{right:34px;transform:rotate(18deg);}
.piggy.wiggle{animation:pigwiggle .55s ease;}
@keyframes pigwiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}55%{transform:rotate(7deg)}80%{transform:rotate(-4deg)}}
.coin{position:fixed;font-size:30px;z-index:320;pointer-events:none;animation:coindrop .75s ease forwards;}
@keyframes coindrop{0%{transform:translateY(-70px) scale(1.1) rotate(0);opacity:1}60%{opacity:1}100%{transform:translateY(46px) scale(.35) rotate(200deg);opacity:0}}
.floatplus{position:fixed;z-index:320;font-weight:800;color:var(--success);font-size:18px;pointer-events:none;animation:floatup 1s ease forwards;text-shadow:0 1px 3px rgba(255,255,255,.7);}
@keyframes floatup{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-46px);opacity:0}}
/* 金猪吉祥物（去背景图片） */
.pigstage{display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:center;gap:26px;min-height:212px;position:relative;padding:8px 0;}
.pigimg{width:158px;height:auto;filter:drop-shadow(0 10px 16px rgba(141,108,99,.30));}
.pigimg.idle{animation:pigidle 3.4s ease-in-out infinite;}
.pigimg.fly{animation:pigfly 1.15s ease-in-out 0s 3 both;}
@keyframes pigidle{0%,100%{transform:translateY(0) rotate(-1.5deg);}50%{transform:translateY(-9px) rotate(1.5deg);}}
@keyframes pigfly{0%{transform:translateY(0) rotate(0) scale(1);}15%{transform:translateY(-54px) rotate(-9deg) scale(1.07);}40%{transform:translateY(10px) rotate(7deg) scale(.97);}65%{transform:translateY(-34px) rotate(-6deg) scale(1.05);}85%{transform:translateY(4px) rotate(4deg) scale(.99);}100%{transform:translateY(0) rotate(0) scale(1);}}
.pighappy{position:absolute;left:50%;top:2px;transform:translateX(-50%);font-size:22px;opacity:0;pointer-events:none;}
.pigimg.fly~.pighappy{animation:happytwinkle 1.15s ease-in-out 0s 3;}
@keyframes happytwinkle{0%,100%{opacity:0;transform:translateX(-50%) translateY(0) scale(1);}50%{opacity:1;transform:translateX(-50%) translateY(-30px) scale(1.3);}}
/* 金色透明存钱柱（金猪右侧） */
.cyl{position:relative;width:62px;height:176px;border-radius:16px 16px 20px 20px;
  background:linear-gradient(180deg,rgba(255,248,224,.34),rgba(232,195,106,.16));
  border:2px solid rgba(212,160,64,.85);
  box-shadow:0 10px 20px rgba(141,108,99,.18),inset 0 0 16px rgba(255,255,255,.5);
  overflow:hidden;}
.cyl::before{content:"";position:absolute;top:8px;left:9px;width:9px;height:calc(100% - 26px);border-radius:8px;
  background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,.04));filter:blur(1px);z-index:2;}
.cyl .cylpct{position:absolute;top:7px;left:0;right:0;text-align:center;font-weight:800;color:#a9791f;font-size:13px;text-shadow:0 1px 2px rgba(255,255,255,.7);z-index:4;}
.cyl .ingots{position:absolute;left:0;right:0;bottom:0;}
.cyl .ingot{position:absolute;left:50%;transform:translateX(-50%);filter:drop-shadow(0 2px 2px rgba(141,108,99,.25));}
.cyl .ingot.intro{animation:ingotdrop .6s cubic-bezier(.3,1.2,.5,1) both;}
.cyl .ingot.drop{animation:ingotdrop .8s cubic-bezier(.3,1.3,.5,1);}
@keyframes ingotdrop{0%{transform:translate(calc(-50% + var(--dx,0px)),-170px) rotate(var(--rot,0deg)) scale(.5);opacity:0}60%{opacity:1}100%{transform:translate(-50%,0) rotate(0deg) scale(1);opacity:1}}
.goalcard .gbar{height:12px;border-radius:8px;background:var(--bg);overflow:hidden;margin-top:6px;}
.goalcard .gbar>i{display:block;height:100%;background:linear-gradient(90deg,#BFE0D5,#9FCDBF);border-radius:8px;transition:width .8s ease;}
.goalcard .grow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.goalcard .grow .gn{font-weight:700;font-size:15px;}
.goalcard .grow .gd{font-size:12px;color:var(--text-soft);}
</style>

const MEM={};

/* 业务键：排除“会话”与“界面状态”，避免污染云端、跨端串味 */
function bizKeys(){
  const out=[];
  if(_storageOK){for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(PREFIX)&&k!==SB_SESSION_KEY&&k!==SB_STATE_KEY)out.push(k);}}
  for(const k in MEM)if(k.startsWith(PREFIX)&&k!==SB_SESSION_KEY&&k!==SB_STATE_KEY)out.push(k);
  return out;
}

/* 低层：带超时（AbortController）的原生 fetch */
async function sbFetch(method,path,body,auth,extra){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),SB_TIMEOUT);
  const headers={"apikey":SB_KEY,"Content-Type":"application/json"};
  if(auth&&sbSession)headers["Authorization"]="Bearer "+sbSession.access_token;
  if(extra)for(const k in extra)headers[k]=extra[k];
  try{
    const res=await fetch(SB_URL+path,{method,headers,body:body!==undefined?JSON.stringify(body):undefined,signal:ctrl.signal});
    clearTimeout(timer);
    return res;
  }catch(e){
    clearTimeout(timer);
    const err=new Error("网络请求失败，请检查网络");err.code="NETERR";throw err;
  }
}
/* 安全解析响应体：空响应返回 null（DELETE/upsert 常无 body） */
async function sbJson(res){
  try{const t=await res.text();if(!t)return null;return JSON.parse(t);}catch(e){return null;}
}

/* 会话管理：本地持久化 / 恢复 / 刷新续期 */
function setSession(s){
  const expIn=Number(s.expires_in)||3600;
  const prev=sbSession||{};
  sbSession={
    access_token:s.access_token,
    refresh_token:s.refresh_token||prev.refresh_token,
    expires_at:Date.now()+expIn*1000-30000,
    user_id:s.user?s.user.id:prev.user_id,
    email:s.user?s.user.email:prev.email
  };
  sbUser={id:sbSession.user_id,email:sbSession.email};
  try{localStorage.setItem(SB_SESSION_KEY,JSON.stringify(sbSession));}catch(e){}
}
function clearSession(){sbUser=null;sbSession=null;try{localStorage.removeItem(SB_SESSION_KEY);}catch(e){}}
/* 登出：清空本机业务数据，确保不同账户间数据隔离 */
function clearLocalData(){
  if(_storageOK){for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(k&&k.startsWith(PREFIX)&&k!==SB_SESSION_KEY)localStorage.removeItem(k);}}
  for(const k in MEM)if(k.startsWith(PREFIX)&&k!==SB_SESSION_KEY)delete MEM[k];
}
/* access_token 过期自动用 refresh_token 续期 */
async function sbRefresh(){
  if(!sbSession||!sbSession.refresh_token)throw new Error("无刷新令牌");
  const res=await sbFetch("POST","/auth/v1/token?grant_type=refresh_token",{refresh_token:sbSession.refresh_token},false);
  const j=await sbJson(res);
  if(!res.ok||!j||!j.access_token)throw new Error("登录已过期，请重新登录");
  setSession({access_token:j.access_token,refresh_token:j.refresh_token||sbSession.refresh_token,expires_in:j.expires_in,user:j.user||null});
  return sbSession;
}
/* 业务 API 封装：遇 401 自动续期并重试一次 */
async function sbApi(method,path,body,extra){
  let res=await sbFetch(method,path,body,true,extra);
  if(res.status===401){
    try{await sbRefresh();}catch(e){clearSession();renderAuth();throw new Error("登录已过期，请重新登录");}
    res=await sbFetch(method,path,body,true,extra);
  }
  return res;
}

/* 登录 / 注册（邮箱 + 密码，原生 fetch 调用 Auth REST） */
async function sbSignIn(email,pw){
  const res=await sbFetch("POST","/auth/v1/token?grant_type=password",{email,password:pw},false);
  const j=await sbJson(res);
  if(!res.ok||!j||!j.access_token)throw new Error((j&&j.error_description)||"登录失败（邮箱或密码错误）");
  setSession({access_token:j.access_token,refresh_token:j.refresh_token,expires_in:j.expires_in,user:j.user});
}
async function sbSignUp(email,pw){
  const res=await sbFetch("POST","/auth/v1/signup",{email,password:pw},false);
  const j=await sbJson(res);
  if(!res.ok||!j)throw new Error((j&&j.error_description)||"注册失败，请稍后重试");
  if(j.session&&j.session.access_token){
    setSession({access_token:j.session.access_token,refresh_token:j.session.refresh_token,expires_in:j.session.expires_in,user:j.session.user||j.user});
  }else{
    throw new Error("注册成功但未自动登录（可能开启了邮箱确认，请查收邮件后登录）");
  }
}

/* 单条 upsert（REST + PostgREST upsert，按 (user_id,key) 唯一约束合并） */
async function sbUpsert(bare,val){
  const res=await sbApi("POST","/rest/v1/app_kv",[{user_id:sbUser.id,key:bare,value:val===undefined?null:val}],{"Prefer":"resolution=merge-duplicates, return=minimal"});
  if(!res.ok){const j=await sbJson(res);console.warn("sync upsert fail",res.status,j);}
}
/* 删除云端行：用云端 id 快照差集（传 id 列表批量删除） */
async function sbDeleteIds(ids){
  if(!ids||!ids.length)return;
  const res=await sbApi("DELETE","/rest/v1/app_kv?id=in.("+ids.join(",")+")");
  if(!res.ok){const j=await sbJson(res);console.warn("sync delete fail",res.status,j);}
}
/* 清空云端：先查全部 id，再按 id 差集删除 */
async function sbClearCloud(){
  if(!sbSession||!sbUser)return;
  try{
    const res=await sbApi("GET","/rest/v1/app_kv?select=id");
    const rows=await sbJson(res)||[];
    const ids=rows.map(r=>r.id).filter(Boolean);
    if(ids.length)await sbDeleteIds(ids);
  }catch(e){console.warn("clear cloud fail",e);}
}

/* 本地修改 -> 先落地本地，再入队异步同步（串行、去重，避免并发冲突） */
const syncMap=new Map();
let syncRunning=false,syncTimer=null;
function sbPush(key,val){
  if(!sbSession||!sbUser)return;
  const bare=String(key).replace(PREFIX,"");
  syncMap.set(bare,val);          // 同 key 覆盖，天然去重
  if(syncTimer)return;
  syncTimer=setTimeout(flushSync,400); // 轻微防抖，合并快速连续保存
}
async function flushSync(){
  syncTimer=null;
  if(syncRunning)return;
  syncRunning=true;
  try{
    const entries=[...syncMap.entries()];syncMap.clear();
    for(const [bare,val] of entries){try{await sbUpsert(bare,val);}catch(e){/* 失败忽略，下次保存会再次入队 */}}
  }finally{syncRunning=false;}
}
/* 登录后拉取：合并策略——云端存在的以云端为准；本地独有键上传；云端独有键下载 */
async function sbPull(){
  if(!sbSession||!sbUser)return;
  try{
    const res=await sbApi("GET","/rest/v1/app_kv?select=id,key,value");
    if(!res.ok){toast("云端同步失败，将使用本地数据","warn");return;}
    const rows=await sbJson(res)||[];
    const cloud={};rows.forEach(r=>{cloud[r.key]={id:r.id,value:r.value};});
    for(const k of bizKeys()){const bare=k.replace(PREFIX,"");if(!cloud[bare]){try{await sbUpsert(bare,load(k,null));}catch(e){}}}
    for(const bare in cloud){if(bare===SB_STATE_KEY.replace(PREFIX,""))continue;const v=cloud[bare].value;try{localStorage.setItem(PREFIX+bare,JSON.stringify(v));}catch(e){MEM[PREFIX+bare]=v;}}
    applySettings();render();
    toast("已从云端同步数据 ✓","ok");
  }catch(e){
    if(String(e.message||"").indexOf("登录")<0)toast("云端同步失败，将使用本地数据","warn");
  }
}

function stripQuotes(v){if(typeof v!=="string")return v;let s=v.trim();if((s.startsWith('"')&&s.endsWith('"'))||(s.startsWith("'")&&s.endsWith("'")))s=s.slice(1,-1).trim();return s;}
function normalizeQuotes(obj){if(Array.isArray(obj))return obj.map(normalizeQuotes);if(obj&&typeof obj==="object"){const o={};for(const k in obj){const vk=stripQuotes(k);let val=obj[k];if(typeof val==="string"&&/^["']?\d+(\.\d+)?["']?$/.test(val.trim()))val=stripQuotes(val);else if(typeof val==="string")val=val.trim();o[vk]=normalizeQuotes(val);}return o;}return obj;}

/* ===== 弹出表单 ===== */
function openForm(cfg){
  const ov=document.createElement("div");ov.className="overlay center";
  const fields=(cfg.fields||[]).map(f=>{
    let ctrl="";const val=escapeHtml(cfg.values&&cfg.values[f.key]!=null?cfg.values[f.key]:"");
    if(f.type==="textarea")ctrl=`<textarea class="fld" data-key="${f.key}" placeholder="${escapeHtml(f.ph||"")}">${val}</textarea>`;
    else if(f.type==="select")ctrl=`<select class="fld" data-key="${f.key}">`+(f.options||[]).map(o=>{const v=typeof o==="object"?o.value:o;const l=typeof o==="object"?o.label:o;return `<option value="${escapeHtml(v)}" ${val===String(v)?"selected":""}>${escapeHtml(l)}</option>`;}).join("")+`</select>`;
    else ctrl=`<input class="fld" data-key="${f.key}" type="${f.type||"text"}" value="${val}" placeholder="${escapeHtml(f.ph||"")}" ${f.step?`step="${f.step}"`:""}>`;
    return `<div class="field"><label>${escapeHtml(f.label)}${f.required?' <span style="color:var(--warn)">*</span>':''}</label>${ctrl}</div>`;
  }).join("");
  ov.innerHTML=`<div class="sheet"><h3>${escapeHtml(cfg.title)}<button class="close" data-x>×</button></h3>${fields}<div class="actions"><button class="btn line" data-x>取消</button><button class="btn" data-submit>${escapeHtml(cfg.submitText||"保存")}</button></div></div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.addEventListener("click",e=>{if(e.target===ov||e.target.hasAttribute("data-x"))close();});
  ov.querySelector("[data-submit]").addEventListener("click",()=>{
    const vals={};let ok=true;
    ov.querySelectorAll(".fld").forEach(el=>{const k=el.dataset.key;let v=el.value;const req=el.closest(".field").querySelector("label").innerHTML.includes("*");if(el.tagName!=="SELECT"&&el.type!=="number")v=v.trim();if(el.type==="number")v=v===""?0:Number(v);if(req&&v===""){ok=false;el.style.borderColor="var(--warn)";}vals[k]=v;});
    if(!ok){toast("请填写必填项","warn");return;}
    cfg.onSubmit(vals);close();if(cfg.after)cfg.after();
  });
  setTimeout(()=>{const f=ov.querySelector(".fld");if(f)f.focus();},50);
  return ov;
}

  if(a.startsWith("fit")||a.startsWith("vid"))return handleFit(a,arg);
  if(a.startsWith("sal")||a.startsWith("sa"))return handleSal(a,arg);
  if(a.startsWith("hr"))return handleHours(a,arg);
  if(a.startsWith("sch"))return handleSchedule(a,arg);
  if(a.startsWith("exp"))return handleExpense(a,arg);

/* ===== 界面状态记忆（打开即恢复到上次停留的板块/筛选） ===== */
function saveState(){save(PREFIX+"state",{current:current,fitView:fitView,salMonth:salMonth,hrMonth:hrMonth},true);}
function loadState(){const s=load(PREFIX+"state",null);if(s&&typeof s==="object"){if(typeof s.current==="string"&&s.current)current=s.current;if(typeof s.fitView==="string")fitView=s.fitView;if(typeof s.salMonth==="string")salMonth=s.salMonth;if(typeof s.hrMonth==="string")hrMonth=s.hrMonth;}}

/* ===== 1. 健身 ===== */
function fitData(){return load(KEYS.fitness,[]);}
function fitVideos(){return load(KEYS.videos,[]);}
function weekRange(){const d=new Date();const day=(d.getDay()+6)%7;const s=new Date(d);s.setDate(d.getDate()-day);const e=new Date(s);e.setDate(s.getDate()+6);const f=x=>x.getFullYear()+"-"+(x.getMonth()+1).toString().padStart(2,"0")+"-"+x.getDate().toString().padStart(2,"0");return [f(s),f(e)];}
function renderFitness(){
  const all=fitData();let rows=all.slice().sort((a,b)=>a.date<b.date?1:-1);
  if(fitView==="today")rows=rows.filter(r=>r.date===today());
  if(fitView==="week"){const [s,e]=weekRange();rows=rows.filter(r=>r.date>=s&&r.date<=e);}
  const vids=fitVideos();
  return `
  <div class="card"><div class="spread"><h3>🏋️ 健身训练打卡</h3>
    <div class="row"><div class="seg">
      <button data-action="fitview" data-arg="all" class="${fitView==="all"?"on":""}">全部</button>
      <button data-action="fitview" data-arg="today" class="${fitView==="today"?"on":""}">今日</button>
      <button data-action="fitview" data-arg="week" class="${fitView==="week"?"on":""}">本周</button></div>
      <button class="btn sm" data-action="fitadd">＋ 打卡</button></div></div>
    ${rows.length?`<table><thead><tr><th>日期</th><th>动作</th><th class="num">负重(kg)</th><th class="num">组数</th><th class="num">次数</th><th>备注</th><th></th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${r.date}</td><td>${escapeHtml(r.action)}</td><td class="num">${fmt1(r.weight)}</td><td class="num">${r.sets||0}</td><td class="num">${r.reps||0}</td><td class="muted">${escapeHtml(r.note||"")}</td><td class="row" style="justify-content:flex-end"><button class="btn line sm" data-action="fitadd" data-arg="${r.id}">改</button><button class="btn warn sm" data-action="fitdel" data-arg="${r.id}">删</button></td></tr>`).join("")}</tbody></table>`
      :`<div class="empty">还没有训练记录，点「打卡」开始吧 💪</div>`}
    <div class="row" style="margin-top:12px"><button class="btn ghost sm" data-action="fithistory">📊 动作历史</button><button class="btn ghost sm" data-action="fitplan">🗓️ 固定训练计划</button><button class="btn ghost sm" data-action="fitexport">⬇️ 导出台账CSV</button></div>
  </div>
  <div class="card"><div class="spread"><h3>📺 B站跟练参考</h3><button class="btn sm ghost" data-action="vidadd">＋ 加卡片</button></div>
    ${vids.length?vids.map(v=>`<div class="vcard"><div class="vt">📺</div><div class="vmeta"><div class="vtitle">${escapeHtml(v.title)}</div>${v.tag?`<span class="vtag">${escapeHtml(v.tag)}</span>`:""}<div style="margin-top:5px"><a href="${escapeHtml(v.url)}" target="_blank" rel="noopener">${escapeHtml(v.url)}</a></div></div><button class="btn warn sm" data-action="viddel" data-arg="${v.id}">移除</button></div>`).join(""):`<div class="empty">暂无参考视频卡片，只保存链接+标题，方便复制跳转 🔗</div>`}
  </div>`;
}
function handleFit(a,arg){
  if(a==="fitview"){fitView=arg;render();return;}
  if(a==="fitadd"){const all=fitData();const ed=arg?all.find(r=>r.id===arg):null;
    openForm({title:ed?"修改训练记录":"新增训练打卡",submitText:ed?"保存修改":"打卡",values:ed||{date:today()},
      fields:[{key:"date",label:"训练日期",type:"date",required:true},{key:"action",label:"动作名称",required:true,ph:"如 卧推"},{key:"weight",label:"负重(kg)",type:"number",step:"0.5"},{key:"sets",label:"组数",type:"number"},{key:"reps",label:"次数",type:"number"},{key:"note",label:"备注",type:"textarea"}],
      onSubmit:v=>{if(ed)Object.assign(ed,v);else all.push(Object.assign({id:uid()},v));save(KEYS.fitness,all);toast("已保存","ok");render();}});return;}
  if(a==="fitdel"){if(confirm("确定删除这条记录？")){save(KEYS.fitness,fitData().filter(r=>r.id!==arg));toast("已删除");render();}return;}
  if(a==="vidadd"){openForm({title:"新增 B站参考视频",submitText:"保存卡片",fields:[{key:"title",label:"视频标题",required:true},{key:"url",label:"B站链接",required:true,ph:"https://..."},{key:"tag",label:"标签",ph:"如 胸/背/有氧"}],
      onSubmit:v=>{const a2=fitVideos();a2.push(Object.assign({id:uid()},v));save(KEYS.videos,a2);toast("已添加卡片","ok");render();}});return;}
  if(a==="viddel"){save(KEYS.videos,fitVideos().filter(v=>v.id!==arg));toast("已移除");render();return;}
  if(a==="fitexport"){const a3=fitData();download("健身台账_"+today()+".csv",toCSV(["日期","动作","负重kg","组数","次数","备注"],a3.map(r=>[r.date,r.action,r.weight,r.sets,r.reps,r.note])),"text/csv;charset=utf-8");toast("已导出CSV","ok");return;}
  if(a==="fithistory"){const a4=fitData();const map={};a4.forEach(r=>map[r.action]=(map[r.action]||0)+1);
    const rows=Object.keys(map).sort((x,y)=>map[y]-map[x]).map(k=>`<tr><td>${escapeHtml(k)}</td><td class="num">${map[k]}</td></tr>`).join("");
    openView("动作历史（按累计次数）",`<table><thead><tr><th>动作</th><th class="num">累计次数</th></tr></thead><tbody>${rows||'<tr><td colspan="2" class="empty">暂无</td></tr>'}</tbody></table>`);return;}
  if(a==="fitplan"){openForm({title:"固定训练计划",submitText:"保存计划",fields:[
      {key:"name",label:"计划名称",required:true,ph:"如 推日A"},
      {key:"items",label:"训练内容（每行：动作|负重|组数|次数）",type:"textarea",ph:"卧推|40|4|12\n引体|0|4|8"}],
      onSubmit:v=>{const items=v.items.split("\n").filter(x=>x.trim()).map(x=>{const p=x.split("|");return{action:p[0]||"",weight:p[1]||0,sets:p[2]||0,reps:p[3]||0};});const a5=load(KEYS.plan,[]);a5.push({id:uid(),name:v.name,items});save(KEYS.plan,a5);toast("计划已保存","ok");render();}});return;}
}

/* ===== 2. 薪资条（陈老师 / 林工 双账户） ===== */
const SAL_CONFIG={
  sal_chen:{key:PREFIX+"salary_chen",title:"👩‍🏫 陈老师薪资条",income:["基本工资","课时补贴","住房补贴","节日补贴","绩效"],expense:["五险一金","餐费","住宿费","工费"]},
  sal_lin:{key:PREFIX+"salary_lin",title:"👷 林工薪资条",income:["基本工资","岗位工资","绩效","餐贴","满勤","加班","岗位津贴"],expense:["五险一金","餐费","其他扣款","工费"]}
};
function salCurCfg(){
  const base=SAL_CONFIG[current]||SAL_CONFIG.sal_chen;
  const t=load(base.key+"_types",null)||{income:[],expense:[]};
  return {key:base.key,title:base.title,income:[...base.income,...(t.income||[])],expense:[...base.expense,...(t.expense||[])]};
}
function salTypeMgrHtml(cfg){
  const base=SAL_CONFIG[current]||SAL_CONFIG.sal_chen;
  const t=load(cfg.key+"_types",null)||{income:[],expense:[]};
  const sec=(k,label)=>{
    const defs=(base[k]||[]).map(n=>`<span class="pill o">${escapeHtml(n)}</span>`).join(" ");
    const cust=(t[k]||[]).map(n=>`<span class="pill p">${escapeHtml(n)} <button class="btn warn sm" data-action="saltypedel" data-arg="${k}~${encodeURIComponent(n)}" style="margin-left:5px;padding:1px 7px;font-size:11px">✕</button></span>`).join(" ");
    return `<div style="margin:10px 0"><div style="font-weight:600;margin-bottom:6px">${label}</div><div class="row">${defs}${cust}</div></div>`;
  };
  return `<p class="muted">灰色为系统预设（不可删除），粉色为你自定义的类型，点 ✕ 可删除。</p>`+sec("income","收入类型")+sec("expense","扣除类型");
}
function salData(){return load(salCurCfg().key,[]);}
function salCompute(v,cfg){let g=0,d=0;cfg.income.forEach(k=>{v[k]=Number(v[k])||0;g+=v[k];});cfg.expense.forEach(k=>{v[k]=Number(v[k])||0;d+=v[k];});v.gross=g;v.net=g-d;return v;}
function salAllocKey(){return salCurCfg().key+"_alloc_"+salMonth;}
function salAllocData(){
  let arr=load(salAllocKey(),null);
  if(arr===null){
    // 首次进入该月：优先从旧全局分配键迁移一次，避免丢失历史数据
    const oldKey=salCurCfg().key+"_alloc";
    const old=load(oldKey,null);
    if(Array.isArray(old)&&old.length){arr=old.map(x=>Object.assign({amount:0,left:0},x));save(salAllocKey(),arr);}
    else {arr=[{id:uid(),name:"交通",amount:0,left:0},{id:uid(),name:"生活",amount:0,left:0},{id:uid(),name:"储蓄",amount:0,left:0},{id:uid(),name:"应急金",amount:0,left:0}];save(salAllocKey(),arr);}
    // 迁移完成（或已用默认）后清除旧全局键，确保只迁移一次
    try{localStorage.removeItem(oldKey);if(typeof MEM==="object"&&MEM)delete MEM[oldKey];}catch(e){}
  }
  return arr;
}
function salAllocBlock(net){
  const arr=salAllocData();
  const total=arr.reduce((s,x)=>s+(Number(x.amount)||0),0);
  const leftTotal=arr.reduce((s,x)=>s+(Number(x.left)||0),0);
  const remain=(Number(net)||0)-total;
  const rows=arr.map(function(x){
    const amt=Number(x.amount)||0,left=Number(x.left)||0;
    return '<tr>'
      +'<td style="min-width:84px"><input class="fld sa-name" data-said="'+x.id+'" value="'+escapeHtml(x.name)+'" style="width:100%"></td>'
      +'<td class="num"><input class="fld sa-amt num" data-said="'+x.id+'" type="number" step="0.01" value="'+amt+'" style="width:104px;text-align:right"></td>'
      +'<td class="num"><input class="fld sa-left num" data-said="'+x.id+'" type="number" step="0.01" value="'+left+'" style="width:104px;text-align:right"></td>'
      +'<td class="row" style="justify-content:flex-end"><button class="btn warn sm" data-action="sadel" data-arg="'+x.id+'">删</button></td></tr>';
  }).join("");
  return '<div style="margin-top:18px;border-top:1px dashed var(--line);padding-top:14px">'
    +'<div class="spread"><h3 style="font-size:16px">💼 工资分配 · '+salMonth+'（预设：交通 / 生活 / 储蓄 / 应急金）</h3>'
    +'<button class="btn sm" data-action="saadd">＋ 新增项目</button></div>'
    +'<div class="stats" style="margin-top:10px">'
    +'<div class="stat"><div class="v">'+money(total)+'</div><div class="l">已分配合计</div></div>'
    +'<div class="stat"><div class="v" style="color:'+(leftTotal>=0?'var(--success)':'var(--warn)')+'">'+money(leftTotal)+'</div><div class="l">剩余合计</div></div>'
    +'<div class="stat"><div class="v" style="color:'+(remain>=0?'var(--success)':'var(--warn)')+'">'+money(remain)+'</div><div class="l">可再分配</div></div>'
    +'<div class="stat"><div class="v">'+arr.length+'</div><div class="l">分配项目数</div></div>'
    +'</div>'
    +'<table class="alloc" style="margin-top:12px"><thead><tr><th>分配项目</th><th class="num">预设金额</th><th class="num">剩余</th><th></th></tr></thead><tbody>'
    +(rows||'<tr><td colspan="4" class="empty">暂无，点「＋ 新增项目」添加</td></tr>')
    +'</tbody></table></div>';
}
function renderSalary(){
  const cfg=salCurCfg();
  const all=salData().slice().sort((a,b)=>a.month<b.month?-1:1);
  const cur=all.filter(r=>r.month===salMonth);
  const months=[...new Set(all.map(r=>r.month))].sort();
  const sum=k=>cur.reduce((s,r)=>s+(Number(r[k])||0),0);
  const curGross=sum("gross"),curNet=sum("net");
  const head=`<th>月份</th><th>日期</th>`+cfg.income.map(k=>`<th class="num">${k}</th>`).join("")+cfg.expense.map(k=>`<th class="num">${k}</th>`).join("")+`<th class="num">应发</th><th class="num">实发(到手)</th><th></th>`;
  const body=cur.map(r=>`<tr><td>${r.month}</td><td>${r.date||""}</td>`+cfg.income.map(k=>`<td class="num">${fmt2(r[k])}</td>`).join("")+cfg.expense.map(k=>`<td class="num">${fmt2(r[k])}</td>`).join("")+`<td class="num">${fmt2(r.gross)}</td><td class="num"><b>${fmt2(r.net)}</b></td><td class="row" style="justify-content:flex-end"><button class="btn line sm" data-action="saladd" data-arg="${r.id}">改</button><button class="btn warn sm" data-action="saldel" data-arg="${r.id}">删</button></td></tr>`).join("");
  return `
  <div class="card"><div class="spread"><h3>${cfg.title}</h3>
    <div class="row"><select id="salMonthSel" class="btn line" style="padding:8px 12px">${months.map(m=>`<option value="${m}" ${m===salMonth?"selected":""}>${m}</option>`).join("")||'<option>暂无</option>'}</select>
    <button class="btn sm" data-action="saladd">＋ 新增</button><button class="btn ghost sm" data-action="saltype">＋ 类型</button><button class="btn ghost sm" data-action="saltypemgr">⚙ 类型</button></div></div>
    <div class="stats">
      <div class="stat"><div class="v">${money(curGross)}</div><div class="l">本月应发合计</div></div>
      <div class="stat"><div class="v" style="color:var(--success)">${money(curNet)}</div><div class="l">本月到手合计</div></div>
      <div class="stat"><div class="v">${cur.length}</div><div class="l">本月条数</div></div>
    </div>
    ${cur.length?`<table style="margin-top:14px"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`:`<div class="empty">该月暂无薪资记录，点「新增」记一笔 💰</div>`}
    ${salAllocBlock(curNet)}
    <div class="row" style="margin-top:12px"><button class="btn ghost sm" data-action="salyear">📅 全年汇总</button><button class="btn ghost sm" data-action="salstat">📊 收入/扣款统计</button><button class="btn ghost sm" data-action="salavg">📈 平均月收入</button><button class="btn ghost sm" data-action="salcmp">🔁 相邻月对比</button><button class="btn ghost sm" data-action="salexport">⬇️ 导出台账CSV</button></div>
  </div>`;
}
function handleSal(a,arg){
  const cfg=salCurCfg();
  if(a==="saladd"){const all=salData();const ed=arg?all.find(r=>r.id===arg):null;
    const fields=[{key:"month",label:"发放月份(YYYY-MM)",required:true},{key:"date",label:"发放日期",type:"date"}];
    cfg.income.forEach(k=>fields.push({key:k,label:"收入 · "+k,type:"number",step:"0.01"}));
    cfg.expense.forEach(k=>fields.push({key:k,label:"扣除 · "+k,type:"number",step:"0.01"}));
    fields.push({key:"note",label:"备注",type:"textarea"});
    openForm({title:(ed?"修改 · ":"新增 · ")+cfg.title,submitText:ed?"保存修改":"保存",values:ed||{month:salMonth,date:today()},fields,
      onSubmit:v=>{salCompute(v,cfg);if(ed)Object.assign(ed,v);else all.push(Object.assign({id:uid()},v));save(cfg.key,all);toast("已保存","ok");render();}});return;}
  if(a==="saldel"){if(confirm("确定删除？")){save(cfg.key,salData().filter(r=>r.id!==arg));toast("已删除");render();}return;}
  if(a==="salyear"){const all=salData();const byM={};all.forEach(r=>{byM[r.month]=byM[r.month]||{g:0,n:0};byM[r.month].g+=Number(r.gross)||0;byM[r.month].n+=Number(r.net)||0;});
    const rows=Object.keys(byM).sort().map(m=>`<tr><td>${m}</td><td class="num">${fmt2(byM[m].g)}</td><td class="num">${fmt2(byM[m].n)}</td></tr>`).join("");
    openView("全年薪资汇总 · "+cfg.title,`<table><thead><tr><th>月份</th><th class="num">应发合计</th><th class="num">到手合计</th></tr></thead><tbody>${rows||'<tr><td colspan="3" class="empty">暂无</td></tr>'}</tbody></table>`);return;}
  if(a==="salstat"){const all=salData();
    const incItems=cfg.income.map(k=>({label:k,v:all.reduce((s,r)=>s+(Number(r[k])||0),0)}));
    const decItems=cfg.expense.map(k=>({label:k,v:all.reduce((s,r)=>s+(Number(r[k])||0),0)}));
    openView("各项收入 / 扣款统计 · "+cfg.title,`<div style="margin-bottom:8px;font-weight:600">收入项</div><canvas id="salInc" height="200"></canvas><div style="margin:14px 0 8px;font-weight:600">扣除项</div><canvas id="salDec" height="200"></canvas>`);
    setTimeout(()=>{drawBar($("#salInc"),incItems,getColor("success"));drawBar($("#salDec"),decItems,getColor("warn"));},60);return;}
  if(a==="salavg"){const all=salData();const months=[...new Set(all.map(r=>r.month))];const avgG=all.reduce((s,r)=>s+(Number(r.gross)||0),0)/(months.length||1);const avgN=all.reduce((s,r)=>s+(Number(r.net)||0),0)/(months.length||1);
    openView("平均月收入 · "+cfg.title,`<div class="stats"><div class="stat"><div class="v">${money(avgG)}</div><div class="l">平均月应发</div></div><div class="stat"><div class="v">${money(avgN)}</div><div class="l">平均月到手</div></div><div class="stat"><div class="v">${months.length}</div><div class="l">覆盖月数</div></div></div>`);return;}
  if(a==="salcmp"){const all=salData().slice().sort((a,b)=>a.month<b.month?-1:1);let html="";for(let i=1;i<all.length;i++){const p=all[i-1],c=all[i];const dn=(Number(c.net)||0)-(Number(p.net)||0);html+=`<tr><td>${p.month}→${c.month}</td><td class="num">${fmt2(p.net)}</td><td class="num">${fmt2(c.net)}</td><td class="num" style="color:${dn>=0?'var(--success)':'var(--warn)'}">${dn>=0?'+':''}${fmt2(dn)}</td></tr>`;}
    openView("相邻月份薪资对比 · "+cfg.title,`<table><thead><tr><th>区间</th><th class="num">上月到手</th><th class="num">本月到手</th><th class="num">差异</th></tr></thead><tbody>${html||'<tr><td colspan="4" class="empty">至少需要两个月的记录</td></tr>'}</tbody></table>`);return;}
  if(a==="salexport"){const all=salData();const head=["月份","日期",...cfg.income,...cfg.expense,"应发","到手","备注"];
    const rows=all.map(r=>[r.month,r.date,...cfg.income.map(k=>r[k]==null?"":r[k]),...cfg.expense.map(k=>r[k]==null?"":r[k]),r.gross,r.net,r.note]);
    download("薪资台账_"+cfg.title.replace(/[^一-龥a-zA-Z0-9]/g,"")+"_"+today()+".csv",toCSV(head,rows),"text/csv;charset=utf-8");toast("已导出CSV","ok");return;}
  if(a==="saadd"){openForm({title:"新增分配项目",submitText:"添加",fields:[{key:"name",label:"项目名称*（如：教育、旅游）",required:true},{key:"amount",label:"分配金额(元)",type:"number",step:"0.01"}],onSubmit:v=>{const arr=salAllocData();arr.push({id:uid(),name:v.name.trim()||"未命名",amount:Number(v.amount)||0,left:0});save(salAllocKey(),arr);toast("已添加项目","ok");render();}});return;}
  if(a==="sadel"){if(confirm("确定删除该分配项目？")){const arr=salAllocData().filter(x=>x.id!==arg);save(salAllocKey(),arr);toast("已删除");render();}return;}
  if(a==="saltype"){openForm({title:"添加收入 / 扣除类型",submitText:"添加",fields:[{key:"kind",label:"类别*",type:"select",options:[{value:"income",label:"收入"},{value:"expense",label:"扣除"}],required:true},{key:"name",label:"类型名称*（如：工费、奖金、高温补贴、报销）",required:true}],onSubmit:v=>{const name=(v.name||"").trim();if(!name){toast("请输入类型名称","");return;}const k=v.kind==="expense"?"expense":"income";if(cfg[k].includes(name)){toast("该类型已存在","");return;}const t=load(cfg.key+"_types",null)||{income:[],expense:[]};t[k]=t[k]||[];t[k].push(name);save(cfg.key+"_types",t);toast("已添加类型："+name,"ok");render();}});return;}
  if(a==="saltypemgr"){openView("类型管理 · "+cfg.title,salTypeMgrHtml(cfg));return;}
  if(a==="saltypedel"){const i=arg.indexOf("~");if(i<0)return;const k=arg.slice(0,i),name=decodeURIComponent(arg.slice(i+1));const t=load(cfg.key+"_types",null)||{income:[],expense:[]};t[k]=(t[k]||[]).filter(n=>n!==name);save(cfg.key+"_types",t);toast("已删除类型："+name);openView("类型管理 · "+cfg.title,salTypeMgrHtml(cfg));return;}
}

  if(e.target&&e.target.id==="salMonthSel"){salMonth=e.target.value;render();}

/* ===== 3. 课时记录（月历核心） ===== */
function hrData(){return load(KEYS.hours,[]);}
function hrByDate(d){return hrData().find(r=>r.date===d);}
function hrMonthRecords(ym){return hrData().filter(r=>r.date.slice(0,7)===ym);}
function pad2(n){return String(+n).padStart(2,"0");}
function fmtYMD(d){return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
function prevMonth(ym){const y=+ym.slice(0,4),m=+ym.slice(5,7);const d=new Date(y,m-2,1);return d.getFullYear()+"-"+pad2(d.getMonth()+1);}
function nextMonth(ym){const y=+ym.slice(0,4),m=+ym.slice(5,7);const d=new Date(y,m,1);return d.getFullYear()+"-"+pad2(d.getMonth()+1);}
function inferHoursDate(text){
  const y=new Date().getFullYear();
  if(/今天/.test(text))return today();
  if(/昨天/.test(text)){const d=new Date();d.setDate(d.getDate()-1);return fmtYMD(d);}
  if(/前天/.test(text)){const d=new Date();d.setDate(d.getDate()-2);return fmtYMD(d);}
  let m=text.match(/(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  if(m)return m[1]+"-"+pad2(m[2])+"-"+pad2(m[3]);
  m=text.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]/);
  if(m)return y+"-"+pad2(m[1])+"-"+pad2(m[2]);
  m=text.match(/(\d{1,2})[-/.](\d{1,2})(?!\d)/);
  if(m)return y+"-"+pad2(m[1])+"-"+pad2(m[2]);
  return null;
}
function inferHoursNum(text){
  const m=text.match(/(\d+(?:\.\d+)?)\s*节/);
  if(m)return Number(m[1]);
  const m2=text.match(/(\d+(?:\.\d+)?)\s*(?:个)?课时?/);
  if(m2)return Number(m2[1]);
  return null;
}
function inferMark(text){
  if(/补课/.test(text))return "补课";
  if(/调课/.test(text))return "调课";
  if(/公开课/.test(text))return "公开课";
  return "";
}
const HR_FEE_DEFAULT=50;
function hrFee(){const v=Number(load(KEYS.settings,{}).feePerHour);return (v>0)?v:HR_FEE_DEFAULT;}
/* 月历构建：按周分组的格子 + 每周小计 + 月合计 */
function hrCalendar(ym){
  const y=+ym.slice(0,4),m=+ym.slice(5,7);
  const daysInMonth=new Date(y,m,0).getDate();
  const startWeekday=(new Date(y,m-1,1).getDay()+6)%7; // 周一=0
  const cells=[];
  for(let i=0;i<startWeekday;i++)cells.push(null);
  for(let d=1;d<=daysInMonth;d++)cells.push(d);
  while(cells.length%7!==0)cells.push(null);
  const weeks=[];
  for(let i=0;i<cells.length;i+=7)weeks.push(cells.slice(i,i+7));
  const weekTotals=weeks.map(wk=>wk.reduce((s,c)=>s+(c?(Number((hrByDate(ym+"-"+pad2(c))||{}).hours)||0):0),0));
  const monthTotal=weekTotals.reduce((s,x)=>s+x,0);
  return {weeks,weekTotals,monthTotal,daysInMonth};
}
function hrHint(){return `<div class="warnbox">💡 课时登记超简单：<br>• 直接发 <b>6节</b>（自动记今天）<br>• 10月27日 6节 （指定某天）<br>• 改成5节 / 10月27日改成5节 （修改）<br>• 标记补课 / 10月27日 调课 （🌸标注）<br>• 删除10月27日 / 查看本月日历 / 10月总课时 / 10月每周课时<br>• 设置课时费 60 （调整每节薪酬）</div>`;}
function pushHrChat(role,text,html){hrChat.push({role,text,html:html||escapeHtml(text)});if(hrChat.length>200)hrChat=hrChat.slice(-200);save(PREFIX+"hours_chat",hrChat);}
function routeHoursCmd(text){
  if(/删除|删掉|移除|清除/.test(text))return hrCmdDel(text);
  if(/取消标记|去掉标记|取消.*🌸|不标|取消.*花/.test(text))return hrCmdUnmark(text);
  if(/课时费|每节.*费|费率|费.*每节/.test(text))return hrCmdFee(text);
  if(/查看.*月|.*月.*(日历|月历)|切换.*月|看.*月|转到.*月|本月日历|这个月日历|当月日历/.test(text))return hrCmdMonth(text);
  if(/每周|周课时|每周课时|周分布|周统计/.test(text))return hrCmdWeekly(text);
  if(/总课时|合计|总数|一共|共多少|月总|总共/.test(text))return hrCmdTotal(text);
  return hrCmdSet(text);
}
function hrCmdSet(text){
  const date=inferHoursDate(text)||today(),num=inferHoursNum(text),mark=inferMark(text);
  if(num==null&&!mark)return {text:"没识别到课时数，例如：6节（默认记今天）或 10月27日 6节",html:hrHint()};
  if(num==null&&!mark)return {text:"没识别到课时数或标记，例如：10月27日 6节 或 10月27日 补课",html:hrHint()};
  const all=hrData();let rec=all.find(r=>r.date===date);
  if(!rec){rec={id:uid(),date,hours:0,mark:""};all.push(rec);}
  if(num!=null)rec.hours=num;
  if(mark)rec.mark=mark;
  save(KEYS.hours,all);
  const parts=[];if(num!=null)parts.push("课时 "+fmt1(num)+" 节");if(mark)parts.push("🌸"+mark);
  return {text:`已登记 ${date}：${parts.join("，")}`,html:`<div class="okbox">✅ 已登记<br>📅 ${date} ｜ ${parts.join(" ｜ ")}</div>`};
}
function hrCmdDel(text){
  const date=inferHoursDate(text)||today();
  const all=hrData();
  if(!all.some(r=>r.date===date))return {text:`${date} 没有课时记录。`,html:`<div class="warnbox">⚠️ ${date} 暂无记录，无需删除。</div>`};
  save(KEYS.hours,all.filter(r=>r.date!==date));
  return {text:`已删除 ${date} 的课时记录。`,html:`<div class="okbox">🗑️ 已删除 <b>${date}</b> 的课时记录。</div>`};
}
function hrCmdFee(text){
  const m=text.match(/(\d+(?:\.\d+)?)/);
  if(!m)return {text:"没识别到费率金额，例如：设置课时费 60",html:hrHint()};
  const n=Number(m[1]);const s=load(KEYS.settings,{});s.feePerHour=n;save(KEYS.settings,s);
  return {text:`已设置每节课时费为 ${money(n)}`,html:`<div class="okbox">💰 已将每节课时费设为 <b>${money(n)}</b>／节</div>`};
}
function hrCmdUnmark(text){
  const date=inferHoursDate(text)||today();
  const all=hrData();const rec=all.find(r=>r.date===date);
  if(!rec||!rec.mark)return {text:`${date} 没有标记。`,html:`<div class="warnbox">⚠️ ${date} 未标记。</div>`};

}
function hrCmdMonth(text){
  let ym;
  if(/本月|这个月|当月|目前|现在/.test(text))ym=today().slice(0,7);
  else{const m=text.match(/(\d{4})[-年.](\d{1,2})/);if(m)ym=m[1]+"-"+pad2(m[2]);else{const m2=text.match(/(\d{1,2})\s*月/);if(m2)ym=new Date().getFullYear()+"-"+pad2(m2[1]);else return {text:"没识别到月份，例如：查看10月日历",html:hrHint()};}}

function hrCmdWeekly(text){

function handleHours(a,arg){
  if(a==="hrsend"){const inp=$("#hrChatInput");if(inp&&inp.value.trim())runHoursCmd(inp.value);return;}
  if(a==="hrquick"){const v=arg||"";if(v.startsWith("FILL:")){const inp=$("#hrChatInput");if(inp){inp.value=v.slice(5);inp.focus();}return;}if(v.startsWith("RUN:")){runHoursCmd(v.slice(4));return;}return;}
  if(a==="hradd"){hrOpenDay(today());return;}
  if(a==="hrday"){hrOpenDay(arg||today());return;}
  if(a==="hrprev"){hrMonth=prevMonth(hrMonth);render();return;}
  if(a==="hrnext"){hrMonth=nextMonth(hrMonth);render();return;}
  if(a==="hrfeecfg"){const cur=hrFee();const v=prompt("设置每节课时费（元/节）",cur);if(v!=null){const n=Number(v);if(!isNaN(n)&&n>=0){const s=load(KEYS.settings,{});s.feePerHour=n;save(KEYS.settings,s);toast("费率已设为 "+money(n),"ok");render();}}return;}
  if(a==="hrdel"){if(confirm("确定删除 "+arg+" 的课时记录？")){save(KEYS.hours,hrData().filter(r=>r.date!==arg));toast("已删除");render();}return;}
  if(a==="hrexport"){const all=hrData();download("课时台账_"+today()+".csv",toCSV(["日期","课时数","标记"],all.map(r=>[r.date,r.hours,r.mark||""])),"text/csv;charset=utf-8");toast("已导出CSV","ok");return;}
}

const EXP_CATS=["餐饮","交通","住房","购物","娱乐","医疗","学习","人情","工资","兼职","理财收益","其他"];
const EXP_TYPE=["收入","支出"];

function budgetData(){return load(KEYS.budget,{});}
/* 日期工具 */
function shiftDay(dateStr,n){const d=new Date(dateStr+"T00:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+(d.getMonth()+1).toString().padStart(2,"0")+"-"+d.getDate().toString().padStart(2,"0");}
function normalizeDateToken(s){s=String(s).replace(/年|月/g,"-").replace(/日|号/g,"").trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m)return m[1]+"-"+String(+m[2]).padStart(2,"0")+"-"+String(+m[3]).padStart(2,"0");m=s.match(/^(\d{1,2})-(\d{1,2})$/);if(m)return new Date().getFullYear()+"-"+String(+m[1]).padStart(2,"0")+"-"+String(+m[2]).padStart(2,"0");return today();}
function isDateStr(s){return /^\d{4}-\d{1,2}-\d{1,2}$/.test(s)||/^\d{1,2}月\d{1,2}[日号]?$/.test(s)||/^\d{1,2}[-./]\d{1,2}$/.test(s);}
function prevMonth(dateStr){const d=new Date(dateStr.slice(0,7)+"-01T00:00:00");d.setMonth(d.getMonth()-1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function thisWeek(){const d=new Date();const day=d.getDay();const mon=new Date(d);mon.setDate(d.getDate()-(day===0?6:day-1));const sun=new Date(mon);sun.setDate(mon.getDate()+6);const f=x=>x.getFullYear()+"-"+(x.getMonth()+1).toString().padStart(2,"0")+"-"+x.getDate().toString().padStart(2,"0");return [f(mon),f(sun)];}
/* 分类识别 */
function detectCategory(text){
  const map=[
    [/餐饮|吃饭|午饭|晚餐|早饭|早餐|外卖|食堂|聚餐|餐厅|饭店|咖啡|奶茶|零食|宵夜/, "餐饮"],
    [/交通|打车|地铁|公交|的士|出租|高铁|火车|机票|车票|加油|停车|过路|车费|滴滴|打车费|公交卡/, "交通"],
    [/住房|房租|房贷|物业|水电|燃气|话费|网费|宽带|物业费|取暖|房租费/, "住房"],
    [/购物|买|衣服|鞋|淘宝|京东|超市|网购|日用品|化妆品|数码|商场/, "购物"],
    [/娱乐|电影|游戏|旅游|唱歌|ktv|玩|游乐|演出|密室|桌游/, "娱乐"],
    [/医疗|药|医院|体检|看病|诊所|挂号|买药|医疗/, "医疗"],
    [/学习|书|课|培训|学费|考试|报名|网课|教材|考证/, "学习"],
    [/人情|红包|随礼|份子|请客|送礼|礼金|人情往来|份子钱/, "人情"],
    [/工资|月薪|薪水|薪酬|发工资|工资收入|底薪|薪资/, "工资"],
    [/兼职|外快|副业|打工|兼职收入|零工/, "兼职"],
    [/理财|基金|利息|股票|炒股|收益|分红|理财收益|股息/, "理财收益"],
  ];
  for(const [re,cat] of map){if(re.test(text))return cat;}
  return "其他";
}
/* 自然语言记账解析：格式【日期｜分类｜收支类型｜金额｜备注】 */
function parseExpenseAdd(raw){
  const text=raw.trim();
  const parts=text.split(/[\s｜|]+/).filter(Boolean).map(s=>s.replace(/[，。、,.\s]/g,""));
  let startIdx=0;
  if(parts[0]&&/^(记账|记一笔|记一下|记)$/.test(parts[0]))startIdx=1;
  const rest=parts.slice(startIdx);
  let date=null,type=null,category=null,amount=null;const note=[];
  for(const p of rest){
    if(!date){
      if(p==="今天"||p==="今日"){date=today();continue;}
      if(p==="昨天"){date=shiftDay(today(),-1);continue;}
      if(p==="前天"){date=shiftDay(today(),-2);continue;}
      if(p==="大前天"){date=shiftDay(today(),-3);continue;}
      if(p==="明天"||p==="明日"){date=shiftDay(today(),1);continue;}
      if(isDateStr(p)){date=normalizeDateToken(p);continue;}
    }
    if(!type&&(p==="收入"||p==="支出")){type=p;continue;}
    if(!category&&EXP_CATS.includes(p)){category=p;continue;}
    const num=p.match(/^(\d+(?:\.\d+)?)(元|块|块钱)?$/);
    if(!amount&&num){amount=Number(num[1]);continue;}
    note.push(p);
  }
  if(!date)date=inferDateFallback(text);
  if(!category)category=detectCategory(text);
  if(!type)type=(["工资","兼职","理财收益"].includes(category))?"收入":"支出";
  if(amount==null){const m=text.match(/(\d+(?:\.\d+)?)/);amount=m?Number(m[1]):0;}
  let noteStr=note.join(" ")
    .replace(/(\d+(?:\.\d+)?)\s*(元|块|块钱)?/g,"")
    .replace(/(今天|昨天|前天|大前天|明天|今日|明日|记账|记一笔|花了|花费|消费|买|了|的|去|在|付|交|充|扣|开销)/g,"")
    .replace(/[，,。.、\s]+/g," ")
    .trim();
  if(noteStr===category||noteStr===type||noteStr===(category+type)||noteStr===(type+category))noteStr="";
  return {date,category:category||"其他",type,amount,note:noteStr};
}
function inferDateFallback(text){
  let m=text.match(/(\d{4})[-./年](\d{1,2})[-./月](\d{1,2})日?/);
  if(m)return normalizeDateToken(m[0]);
  m=text.match(/(\d{1,2})月(\d{1,2})[日号]?/);
  if(m)return normalizeDateToken(m[0]);
  m=text.match(/(\d{1,2})[-./](\d{1,2})(?![\d-])/);
  if(m)return normalizeDateToken(m[0]);
  if(/前天/.test(text))return shiftDay(today(),-2);
  if(/大前天/.test(text))return shiftDay(today(),-3);
  if(/昨天/.test(text))return shiftDay(today(),-1);
  if(/明天|明日/.test(text))return shiftDay(today(),1);
  return today();
}
function filterByPeriod(all,text){
  const y=new Date().getFullYear();let start=null,end=null,label="全部";
  const rng=text.match(/(\d{4}[-/.年]\d{1,2}[-/.月]\d{1,2}日?|\d{1,2}月\d{1,2}日?|\d{1,2}[-/.]\d{1,2})\s*(?:到|至|~|-|—|～)\s*(\d{4}[-/.年]\d{1,2}[-/.月]\d{1,2}日?|\d{1,2}月\d{1,2}日?|\d{1,2}[-/.]\d{1,2})/);
  if(rng){start=normalizeDateToken(rng[1]);end=normalizeDateToken(rng[2]);label=start+" 至 "+end;}
  else if(/本月|这个月|当月|这月/.test(text)){const m=today().slice(0,7);start=m+"-01";end=m+"-31";label=m+"（本月）";}
  else if(/上月|上个月/.test(text)){const pm=prevMonth(today());start=pm+"-01";end=pm+"-31";label=pm+"（上月）";}
  else if(/今年|本年|全年/.test(text)){start=y+"-01-01";end=y+"-12-31";label=y+"（本年）";}
  else if(/今天|今日/.test(text)){start=end=today();label=today();}
  else if(/昨天/.test(text)){start=end=shiftDay(today(),-1);label=start;}
  else if(/本周|这周|这一周/.test(text)){const w=thisWeek();start=w[0];end=w[1];label="本周";}
  else{const mm=text.match(/(\d{4})[-年.](\d{1,2})/);if(mm){const m=mm[1]+"-"+String(+mm[2]).padStart(2,"0");start=m+"-01";end=m+"-31";label=m;}else{const m2=text.match(/(\d{1,2})\s*月/);if(m2){const m=y+"-"+String(+m2[1]).padStart(2,"0");start=m+"-01";end=m+"-31";label=m;}}}
  let list=all;
  if(start&&end)list=all.filter(r=>r.date>=start&&r.date<=end);
  return {list,label,start,end};
}

function cmdPeriodStats(text){

  return {text:`统计${f.label}：收入${money(inc)}，支出${money(out)}，结余${money(inc-out)}`,html};

function cmdCategory(text){

}
function cmdReview(text){

function backupCollect(){const out={};if(_storageOK){for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(PREFIX)){try{out[k]=JSON.parse(localStorage.getItem(k));}catch(e){}}}}for(const k in MEM){if(k.startsWith(PREFIX))out[k]=MEM[k];}return out;}
function handleBackup(a,arg){

  if(a==="svedit"){const f=saveFlow().find(x=>x.id===arg);if(!f)return;const goals=saveGoals();
    openForm({title:"修改存入记录",submitText:"保存",values:f,fields:[
      {key:"date",label:"日期",type:"date",required:true},{key:"goalId",label:"对应目标",type:"select",options:goals.map(g=>({value:g.id,label:g.name})),required:true},{key:"amount",label:"金额",type:"number",step:"0.01",required:true},{key:"source",label:"资金来源",type:"select",options:["奖金","结余","红包","定投","临时支取","其他"].map(s=>({value:s,label:s})),required:true},{key:"note",label:"备注",type:"textarea"}],
      onSubmit:v=>{Object.assign(f,v);save(KEYS.save_flow,saveFlow());toast("已保存","ok");render();}});return;}
  if(a==="svdel"){if(confirm("确定删除该流水？")){save(KEYS.save_flow,saveFlow().filter(x=>x.id!==arg));toast("已删除");render();}return;}
  if(a==="svmonth"){const f=saveFlow();const byM={};f.forEach(r=>{const m=r.date.slice(0,7);const o=byM[m]=byM[m]||{in:0,out:0};if(r.kind==="取")o.out+=Number(r.amount)||0;else o.in+=Number(r.amount)||0;});
    const rows=Object.keys(byM).sort().map(m=>`<tr><td>${m}</td><td class="num">${fmt2(byM[m].in)}</td><td class="num">${fmt2(byM[m].out)}</td><td class="num">${fmt2(byM[m].in-byM[m].out)}</td></tr>`).join("");
    openView("月度存入汇总",`<table><thead><tr><th>月份</th><th class="num">存入</th><th class="num">取出</th><th class="num">净存入</th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="empty">暂无</td></tr>'}</tbody></table>`);return;}
  if(a==="svexport"){const goals=saveGoals();const f=saveFlow();const rows=f.map(r=>{const g=goals.find(x=>x.id===r.goalId);return [r.date,g?g.name:"",r.kind,r.amount,r.source,r.note];});
    download("存钱台账_"+today()+".csv",toCSV(["日期","目标","类型","金额","来源","备注"],rows),"text/csv;charset=utf-8");toast("已导出CSV","ok");return;}
}

/* ===== 图表（Canvas） ===== */
function getColor(t){return t==="success"?"#5F9C86":t==="warn"?"#D98B86":"#8D6C63";}
function drawBar(canvas,items,color){
  if(!canvas)return;const ctx=canvas.getContext("2d");const W=canvas.width=canvas.clientWidth||320;const H=canvas.height=180;ctx.clearRect(0,0,W,H);
  const max=Math.max(1,...items.map(i=>i.v));const pad=28;const bw=(W-pad*2)/items.length;
  ctx.fillStyle="#A98B7E";ctx.font="11px sans-serif";ctx.textAlign="center";
  items.forEach((it,i)=>{const h=(H-40)*it.v/max;const x=pad+i*bw+bw/2;const y=H-20-h;ctx.fillStyle=color;ctx.fillRect(x-bw/2+6,y,bw-12,h);ctx.fillStyle="#8D6C63";ctx.fillText(it.label,x,H-6);ctx.fillStyle=color;ctx.fillText(it.v.toFixed(it.v%1?1:0),x,y-4);});
}
function drawLine(canvas,points,color){
  if(!canvas)return;const ctx=canvas.getContext("2d");const W=canvas.width=canvas.clientWidth||320;const H=canvas.height=180;ctx.clearRect(0,0,W,H);
  if(!points.length)return;const max=Math.max(1,...points.map(p=>p.v));const pad=30;const step=(W-pad*2)/(points.length-1||1);
  ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();points.forEach((p,i)=>{const x=pad+i*step;const y=H-20-(H-40)*p.v/max;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});ctx.stroke();
  ctx.fillStyle="#A98B7E";ctx.font="10px sans-serif";ctx.textAlign="center";points.forEach((p,i)=>{const x=pad+i*step;ctx.fillText(p.label,x,H-4);});
}

/* ===== PWA Manifest（内联，无需外部文件） ===== */
function setupPWA(){
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"><rect width="512" height="512" rx="112" fill="#CFE4DD"/><text x="50%" y="54%" font-size="280" text-anchor="middle" dominant-baseline="middle">🌿</text></svg>';
  const iconUri="data:image/svg+xml,"+encodeURIComponent(svg);
  const link=document.createElement("link");link.rel="apple-touch-icon";link.href=iconUri;document.head.appendChild(link);
  const m={name:"生活事务台",short_name:"事务台",description:"一站式生活统筹工作台",start_url:".",display:"standalone",background_color:"#F9F4EA",theme_color:"#8D6C63",icons:[{src:iconUri,sizes:"512x512",type:"image/svg+xml"}]};
  const ml=document.createElement("link");ml.rel="manifest";ml.href="data:application/manifest+json,"+encodeURIComponent(JSON.stringify(m));document.head.appendChild(ml);
}

init();
</script>
